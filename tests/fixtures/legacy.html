let level="facil",selectedThemes=new Set(["geral","entretenimento","atualidades"]),round=[],idx=0,score=0,hits=0,answered=false,playerName="";
const points={facil:10,medio:20,dificil:30},labels={facil:"Fácil",medio:"Médio",dificil:"Difícil"};
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function configKey(){return level+"|"+[...selectedThemes].sort().join("-")}
function available(){return bank[level].filter(q=>selectedThemes.has(q.t))}
function updateBest(){const b=JSON.parse(localStorage.getItem("quizBest")||"{}");$("best").textContent=b[level]?"Recorde neste nível: "+b[level]+" pontos":"Ainda não há recorde neste nível";const used=JSON.parse(localStorage.getItem("quizUsed")||"{}")[configKey()]||[];$("cycleInfo").textContent=Math.max(0,available().length-used.length)+" perguntas inéditas neste ciclo."}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");level=b.dataset.level;updateBest()});
document.querySelectorAll(".theme").forEach(b=>b.onclick=()=>{if(selectedThemes.has(b.dataset.theme)){if(selectedThemes.size===1)return;selectedThemes.delete(b.dataset.theme);b.classList.remove("selected")}else{selectedThemes.add(b.dataset.theme);b.classList.add("selected")}updateBest()});
$("startForm").onsubmit=e=>{e.preventDefault();playerName=$("name").value.trim();if(!playerName)return;localStorage.setItem("quizName",playerName);startGame()};
function startGame(){const pool=available(),allUsed=JSON.parse(localStorage.getItem("quizUsed")||"{}"),key=configKey();let used=allUsed[key]||[],unseen=pool.filter(q=>!used.includes(q.id)),picked=[];if(unseen.length<10){picked=shuffle(unseen);used=[];const need=10-picked.length;picked.push(...shuffle(pool.filter(q=>!picked.some(p=>p.id===q.id))).slice(0,need))}else picked=shuffle(unseen).slice(0,10);round=shuffle(picked);used.push(...round.map(q=>q.id));allUsed[key]=[...new Set(used)];localStorage.setItem("quizUsed",JSON.stringify(allUsed));idx=score=hits=0;$("player").textContent=playerName;$("levelLabel").textContent=labels[level];show("game");renderQuestion()}
function renderQuestion(){answered=false;const q=round[idx];$("count").textContent="Pergunta "+(idx+1)+" de 10";$("bar").style.width=((idx+1)*10)+"%";$("liveScore").textContent=score+" pontos";$("category").textContent=q.c;$("question").textContent=q.q;$("feedback").textContent="";$("feedback").className="feedback";$("next").classList.remove("show");$("options").innerHTML="";q.o.forEach((text,i)=>{const b=document.createElement("button");b.className="option";b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+text+"</span>";b.onclick=()=>answer(i);$("options").appendChild(b)})}
function answer(choice){if(answered)return;answered=true;const q=round[idx],buttons=[...$("options").children];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct")});if(choice===q.a){score+=points[level];hits++;$("feedback").textContent="Acertou! +"+points[level]+" pontos";$("feedback").className="feedback good"}else{buttons[choice].classList.add("wrong");$("feedback").textContent="A resposta correta é: "+q.o[q.a];$("feedback").className="feedback bad"}$("liveScore").textContent=score+" pontos";$("next").textContent=idx===9?"Ver resultado":"Próxima pergunta";$("next").classList.add("show")}
$("next").onclick=()=>{idx++;idx<10?renderQuestion():finish()};
function finish(){const max=points[level]*10,pct=Math.round(hits*10),b=JSON.parse(localStorage.getItem("quizBest")||"{}");if(score>(b[level]||0)){b[level]=score;localStorage.setItem("quizBest",JSON.stringify(b))}$("finalScore").textContent=score;$("hits").textContent=hits+"/10";$("bestResult").textContent=b[level];$("ring").style.setProperty("--pct",pct+"%");$("trophy").textContent=hits>=8?"🏆":hits>=5?"⭐":"🧠";$("resultTitle").textContent=hits>=8?"Excelente, "+playerName+"!":hits>=5?"Mandou bem, "+playerName+"!":"Continue tentando, "+playerName+"!";$("resultMsg").textContent="Você acertou "+hits+" de 10 no nível "+labels[level]+".";show("result")}
